# One-click deploy on Render (https://render.com): New → Blueprint → pick this repository.
# Creates the game server (Docker) and a Postgres database, wired together.
services:
  - type: web
    name: augment-arena
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: augment-arena-db
          property: connectionString
      - key: SEASON
        value: "1"

databases:
  - name: augment-arena-db
    plan: free
    databaseName: augment_arena
