# Production stack for a VPS: Postgres + game server on one port (default 5555, plain HTTP).
# Usage: ./deploy/install.sh   (first time)   ·   ./deploy/update.sh   (after git pull)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: ..
    environment:
      DATABASE_URL: postgres://chess:${POSTGRES_PASSWORD}@db:5432/chess
      SEASON: ${SEASON:-1}
      PORT: 8080
    ports:
      - "${PUBLIC_PORT:-5555}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
